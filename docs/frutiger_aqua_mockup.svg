    <linearGradient id="waterFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48cae4" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#005f8c" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="gelCoral" x1="0" y1="0" x2="0" y2="1">

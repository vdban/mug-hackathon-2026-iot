services:
  - type: web
    name: smart-aquarium-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: smart_aquarium_iot
      - key: DD_API_KEY
        sync: false
      - key: DD_APP_KEY
        sync: false
      - key: DD_SITE
        value: datadoghq.com
      - key: DD_ENV
        value: hackathon
      - key: DD_SERVICE
        value: smart-aquarium-service
      - key: DD_TRACE_ENABLED
        value: "false"
